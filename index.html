      ` : `<div class="pmeta">你方阵容评分：${analysis.squadQuality}（对方阵容尚未确定，暂时无法对比）</div>`}
    </div>
    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
      ${S.mode!=='cup' ? `<button class="ghost" id="btn-back-draft">← 返回调整阵容</button>` : ''}
      <button class="primary" id="btn-kickoff">${kickoffLabel}</button>
      ${showInstantSim ? `<button class="ghost" id="btn-instant-sim">🎲 直接模拟结果（跳过比赛过程）</button>` : ''}
    </div>
  </div>`;
}

/* ---------- 8. Chemistry / Fit computation ---------- */
function attackFitFor(tacticKey, xi, staminaMap){
  const stF = p => staminaMap ? (0.7+0.3*((staminaMap[p.id]!=null?staminaMap[p.id]:100)/100)) : 1;
  const fw = xi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  const mf = xi.filter(p=>['CM','CDM','CAM','LM','RM'].includes(p.pos));
  const df = xi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  let score=70;
  if(tacticKey==='counter'){
    score = avg([...fw.map(p=>p.pac*stF(p)), ...mf.map(p=>p.pas)]) || 70;
  } else if(tacticKey==='longball'){
    score = avg([...fw.map(p=>p.phy*stF(p)), ...df.map(p=>p.phy*stF(p)), ...mf.map(p=>p.pas)]) || 70;
  } else if(tacticKey==='wings'){
    const wingers = xi.filter(p=>['LW','RW','LM','RM'].includes(p.pos));
    score = avg([...wingers.map(p=>p.pac*stF(p)), ...wingers.map(p=>p.dri), ...df.filter(p=>['LB','RB','LWB','RWB'].includes(p.pos)).map(p=>p.pas)]) || 70;
  } else if(tacticKey==='possession'){
    score = avg([...mf.map(p=>p.pas), ...mf.map(p=>p.dri)]) || 70;
  } else if(tacticKey==='totalfootball'){
    score = avg(xi.filter(p=>!p.gk).map(p=>(p.pac*stF(p)+p.pas+p.dri+p.def)/4)) || 70;
  } else if(tacticKey==='combination'){
    const wideMf = xi.filter(p=>['LW','RW','LM','RM'].includes(p.pos));
    score = avg([...wideMf.map(p=>(p.pas*stF(p)+p.dri)/2), ...mf.filter(p=>['CM','CAM'].includes(p.pos)).map(p=>(p.pas*stF(p)+p.dri)/2)]) || 70;
  } else if(tacticKey==='halfspace'){
    const runners = xi.filter(p=>['CAM','LW','RW','LM','RM'].includes(p.pos));
    score = avg(runners.map(p=>(p.dri*stF(p)*0.5 + p.pas*0.3 + p.sho*0.2))) || 70;
  }
  return Math.max(45, Math.min(99, Math.round(score)));
}
function defenseFitFor(tacticKey, xi, staminaMap){
  const stF = p => staminaMap ? (0.7+0.3*((staminaMap[p.id]!=null?staminaMap[p.id]:100)/100)) : 1;
  const df = xi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  const mf = xi.filter(p=>['CM','CDM','CAM','LM','RM'].includes(p.pos));
  const fw = xi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  let score=70;
  if(tacticKey==='low'){
    score = avg(df.map(p=>p.def*stF(p))) || 70;
  } else if(tacticKey==='mid'){
    score = avg([...df.map(p=>p.def*stF(p)), ...mf.map(p=>p.def*stF(p))]) || 70;
  } else if(tacticKey==='high'){
    score = avg([...mf.map(p=>p.phy*stF(p)), ...mf.map(p=>p.def*stF(p)), ...fw.map(p=>p.def*stF(p))]) || 60;
  } else if(tacticKey==='offside'){
    const cbs = xi.filter(p=>p.pos==='CB');
    const backLine = cbs.length ? cbs : df;
    score = avg(backLine.map(p=>(p.pac*stF(p)+p.def*stF(p))/2)) || 65;
  } else if(tacticKey==='catenaccio'){
    const cbs = xi.filter(p=>p.pos==='CB');
    const sweeper = cbs.length ? cbs.reduce((a,b)=>a.def>=b.def?a:b) : null;
    score = avg([...df.map(p=>p.def*stF(p)), ...(sweeper?[sweeper.def*1.15]:[])]) || 70;
  } else if(tacticKey==='zonal'){
    score = avg([...df.map(p=>p.def*stF(p)), ...mf.map(p=>p.def*stF(p))]) * 1.0 || 70;
  }
  return Math.max(40, Math.min(99, Math.round(score)));
}

/* Line-by-line (GK/DEF/MID/FWD) average OVR comparison between the two
   sides, shown on the tactics screen so both squad rating and concrete
   strengths/weaknesses are visible before kickoff, not just after. */
function lineAverages(xi){
  const gk = xi.filter(p=>p.gk);
  const df = xi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  const mf = xi.filter(p=>['CDM','CM','CAM','LM','RM'].includes(p.pos));
  const fw = xi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  return {
    gk: gk.length?avg(gk.map(p=>p.ovr)):0,
    def: df.length?avg(df.map(p=>p.ovr)):0,
    mid: mf.length?avg(mf.map(p=>p.ovr)):0,
    fwd: fw.length?avg(fw.map(p=>p.ovr)):0,
  };
}
const LINE_LABELS = {gk:'门将', def:'后防线', mid:'中场线', fwd:'锋线'};
function squadCompareRows(myXi, oppXi){
  const mine = lineAverages(myXi), opp = lineAverages(oppXi);
  return Object.keys(LINE_LABELS).map(key=>{
    const diff = mine[key]-opp[key];
    return {key, label:LINE_LABELS[key], mine:mine[key], opp:opp[key], diff};
  });
}

function computeAnalysis(squad, xi, formation, tactics, isAI, staminaMap){
  const bonuses=[]; const warnings=[];
  const clubCounts={}, natCounts={};
  xi.forEach(p=>{ clubCounts[p.club]=(clubCounts[p.club]||0)+1; natCounts[p.nation]=(natCounts[p.nation]||0)+1; });
  Object.entries(clubCounts).forEach(([club,n])=>{
    if(n>=6) bonuses.push({label:`${club} Identity`, tag:'gold'});
    else if(n>=5) bonuses.push({label:`${club} Core`, tag:'club'});
    else if(n>=4) bonuses.push({label:`${club} Link`, tag:'club'});
  });
  Object.entries(natCounts).forEach(([nat,n])=>{
    if(n>=4) bonuses.push({label:`${nat} Connection`, tag:'nation'});
  });
  COMBOS.forEach(c=>{
    const names = xi.map(p=>p.name);
    if(c.names.every(n=>names.includes(n))) bonuses.push({label:`${c.name}`, tag:'combo', desc:c.desc});
  });
  const penalties=[];
  // structure bonuses
  const cbs = xi.filter(p=>p.pos==='CB');
  const cdm = xi.find(p=>p.pos==='CDM');
  if(cdm && cdm.def>=82 && cbs.length>=2 && cbs.every(p=>p.def>=85)) bonuses.push({label:'Defensive Triangle', tag:'structure'});
  const mids = xi.filter(p=>['CM','CDM','CAM'].includes(p.pos));
  const hasDef = mids.some(p=>p.def>=80), hasPass = mids.some(p=>p.pas>=85), hasDri = mids.some(p=>p.dri>=80);
  if(hasDef && hasPass && hasDri && mids.length>=3) bonuses.push({label:'Complete Midfield', tag:'structure'});
  const frontline = xi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  if(frontline.length && avg(frontline.map(p=>p.pac))>=86) bonuses.push({label:'Rapid Frontline', tag:'structure'});
  const st = xi.filter(p=>p.pos==='ST'||p.pos==='CF');
  const wide = xi.filter(p=>['LB','RB','LWB','RWB','LM','RM','LW','RW'].includes(p.pos));
  if(st.length && avg(st.map(p=>p.phy))>=82 && wide.length && avg(wide.map(p=>p.pas))>=76) bonuses.push({label:'Aerial Threat', tag:'structure'});
  // mismatch check for Balanced XI
  const slots = FORMATIONS[formation];
  let mismatches=0;
  slots.forEach((slotPos,i)=>{
    const pid = isAI ? S.aiLineup[i] : S.lineup[i];
    const p = pid && byId(pid);
    if(p && p.pos!==slotPos && !(COMPAT[slotPos]||[]).includes(p.pos) && !(p.alt&&p.alt.includes(slotPos))) mismatches++;
  });
  if(mismatches===0) bonuses.push({label:'Balanced XI', tag:'structure'});
  else warnings.push({label:`存在 ${mismatches} 处位置错配`});

  const attackFit = attackFitFor(tactics.attack, xi, staminaMap);
  const defenseFit = defenseFitFor(tactics.defense, xi, staminaMap);
  if(attackFit<70) warnings.push({label:`${ATTACK_TACTICS[tactics.attack].label} 适配偏低（球员特点不匹配）`});
  if(defenseFit<65) warnings.push({label:`${DEFENSE_TACTICS[tactics.defense].label} 体能/对抗压力预警`});
  if(tactics.defense==='high'){
    const staProxy = avg(xi.map(p=>p.phy));
    if(staProxy<78) warnings.push({label:'High Press 体能储备不足，下半场易被打身后空间'});
  }

  // core fit — a single chosen player, matched against how well his attributes
  // suit the tactic currently in use (no separate "role" selection needed).
  let coreFitLabel='未选择核心', coreFitTag='warn', coreSuggestedTactic=null;
  const core = tactics.coreId ? xi.find(p=>p.id===tactics.coreId) : null;
  if(core){
    coreSuggestedTactic = bestTacticForPlayer(core);
    if(coreSuggestedTactic === tactics.attack){ coreFitLabel='Perfect Fit'; coreFitTag='gold'; }
    else { coreFitLabel=`更适合 ${ATTACK_TACTICS[coreSuggestedTactic].label}`; coreFitTag='club'; }
  }

  const squadQuality = Math.round(avg(xi.map(p=>p.ovr)));
  const chemistryScore = Math.min(100, 55 + bonuses.length*7);

  return {bonuses, warnings, penalties, attackFit, defenseFit, coreFitLabel, coreFitTag, coreSuggestedTactic, squadQuality, chemistryScore, core};
}

/* ---------- 9. MATCH SIMULATION ----------
   The match runs as a chain of short "possession episodes" (12–26 in-game
   seconds each) instead of one dice-roll per minute. Each episode:
     1) advances the continuous MM:SS clock,
     2) drains stamina,
     3) decides who has the ball and narrates 1 quick build-up line,
     4) may escalate into an attacking sequence (cross / through ball / long
        ball / knock-down depending on the attack tactic and the chosen core
        player), which may in turn produce a shot, corner, foul, penalty or
        injury.
   Each event carries a "tier" (1 quiet, 2 notable, 3 major) and the tier
   controls both its log styling and how long the engine pauses before the
   next episode — this is what gives the log its rhythm. */

const ZONE_LABELS = {own:'后场', mid:'中场', final:'前场', edge:'禁区外围', box:'禁区内'};
const ZONE_ORDER = ['own','mid','final','edge','box'];

function fmtClock(sec){
  const mm = Math.floor(sec/60);
  const ss = Math.floor(sec%60);
  return `${mm}:${ss<10?'0':''}${ss}`;
}

function startMatch(){
  ensureAiSetup();
  const xi = startXI();
  const aiXi = Object.values(S.aiLineup).map(byId).filter(Boolean);
  const usedIds = new Set(xi.map(p=>p.id));
  const userBench = S.userSquad.filter(p=>!usedIds.has(p.id));
  const aiUsedIds = new Set(aiXi.map(p=>p.id));
  const aiBench = S.aiSquad.filter(p=>!aiUsedIds.has(p.id));
  const stamina = {};
  [...xi, ...aiXi].forEach(p=>{ stamina[p.id]=100; });
  S.match = {
    clockSec:0,
    score:{user:0, ai:0},
    log:[],
    zone:'mid', possession:'user', ballY:50,
    banner:{text:'🟢 开赛！', cls:'goal'},
    pendingPenalty:null,
    pendingOneOnOne:null,
    pendingFreeKick:null,
    pendingTacticalFoul:null,
    userSpecialChoicesUsed:0,
    userSpecialChoicesTarget: Math.random()<0.5 ? 1 : 2,
    stats:{
      user:{shots:0,sot:0,poss:50,possTicks:0,fouls:0,yellow:0,red:0,corners:0,saves:0},
      ai:{shots:0,sot:0,poss:50,possTicks:0,fouls:0,yellow:0,red:0,corners:0,saves:0},
    },
    ratings:{}, goals:[], assists:[], playerMatchStats:{},
    stamina, userBench, aiBench,
    subsUsed:{user:0, ai:0},
    pushFlagged:{user:false, ai:false},
    timeoutsLeft:3,
    running:false,
    paused:false,
    halftimeDone:false,
    finished:false,
    xi, aiXi,
    tactics: clone(S.tactics), aiTactics: clone(S.aiTactics),
  };
  [...xi, ...aiXi].forEach(p=>{ S.match.ratings[p.id] = 6.2; });
  S.screen='vs-poster';
  render();
}

function beginMatchAfterPoster(){
  S.screen='match';
  render();
  resumeClock(1000);
}

function addLog(text, cls, tier){
  const m = S.match;
  const minute = Math.min(90, Math.floor(m.clockSec/60)+1);
  const sec = Math.floor(m.clockSec%60);
  m.log.push({min:minute, sec, text, cls, tier: tier||1});
}

function playerDecayRate(p){
  if(p.gk) return 0.12;
  let posFactor;
  if(['ST','CF','LW','RW','LM','RM'].includes(p.pos)) posFactor = 1.18; // constant sprinting
  else if(['CDM','CM','CAM'].includes(p.pos)) posFactor = 1.05; // box-to-box running
  else if(p.pos==='CB') posFactor = 0.78; // least ground to cover
  else posFactor = 0.95; // fullbacks/wingbacks
  const fitness = 1 - (p.phy-72)/230; // higher PHY = better engine = slower drop-off
  const variance = 1 + rand(-0.15,0.15); // no two players fade identically
  return Math.max(0.45, posFactor*fitness*variance);
}

function decayStamina(dur){
  const m = S.match;
  const scale = dur/20;
  ['user','ai'].forEach(side=>{
    const xi = side==='user'?m.xi:m.aiXi;
    const tactics = side==='user'?m.tactics:m.aiTactics;
    const pressBonus = tactics.defense==='high' ? 0.10 : 0;
    const tempoBonus = ['counter','wings'].includes(tactics.attack) ? 0.05 : 0;
    xi.forEach(p=>{
      const base = (0.16 + pressBonus + tempoBonus) * playerDecayRate(p);
      const floor = p.gk ? 70 : 35;
      m.stamina[p.id] = Math.max(floor, (m.stamina[p.id]!=null?m.stamina[p.id]:100) - base*scale);
    });
  });
}

function urgencyMultiplier(side){
  const m = S.match;
  const oppSide = side==='user'?'ai':'user';
  const diff = m.score[side] - m.score[oppSide];
  const minute = Math.floor(m.clockSec/60)+1;
  let atk=1;
  if(minute>60){
    if(diff<0) atk=1.22;
    else if(diff>0) atk=0.82;
  }
  return atk;
}

function buildupLine(side){
  const m = S.match;
  const xi = side==='user'?m.xi:m.aiXi;
  const tactics = side==='user'?m.tactics:m.aiTactics;
  const label = sideLabel(side);
  const core = tactics.coreId ? xi.find(p=>p.id===tactics.coreId) : null;
  const mids = xi.filter(p=>['CDM','CM','CAM','LM','RM'].includes(p.pos));
  const defs = xi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  const wide = xi.filter(p=>['LM','RM','LW','RW','LB','RB','LWB','RWB'].includes(p.pos));
  const pool = mids.length ? mids : (defs.length?defs:xi.filter(p=>!p.gk));
  if(!pool.length) return `${label}控制球权`;
  const carrier = (core && Math.random()<0.25) ? core : pick(pool);
  m.carrierName = carrier.name;
  let text;
  if(tactics.attack==='possession'){
    const others = pool.filter(p=>p.id!==carrier.id);
    const other = others.length?pick(others):carrier;
    text = `${carrier.name} → ${other.name}`;
  } else if(tactics.attack==='counter'){
    text = `${carrier.name}断球后迅速前传`;
  } else if(tactics.attack==='longball'){
    text = `${carrier.name}一脚长传找前场`;
  } else {
    const w = wide.length?pick(wide):carrier;
    text = `${carrier.name}把球交给${w.name}`;
  }
  if(core && carrier.id===core.id) text += '（核心）';
  return `${label} ${text}`;
}

function maybeCorner(side, oppSide){
  const m = S.match;
  if(Math.random()>=0.25) return 1;
  m.stats[side].corners++;
  const label = sideLabel(side);
  addLog(`${label}获得角球`, 'chance', 2);
  const atkXi = side==='user'?m.xi:m.aiXi;
  const defXi = side==='user'?m.aiXi:m.xi;
  const outfield = atkXi.filter(p=>!p.gk);
  if(!outfield.length) return 2;
  const target = outfield.reduce((a,b)=> a.phy>=b.phy?a:b);
  m.carrierName = target.name;
  const gk = defXi.find(p=>p.gk);
  const cbs = defXi.filter(p=>p.pos==='CB');
  const defHeader = cbs.length ? avg(cbs.map(p=>p.phy)) : 70;
  const quality = target.phy*0.6 + rand(-10,10) - defHeader*0.2;
  if(quality > 80 && Math.random() < 0.12){
    m.stats[side].shots++; m.stats[side].sot++;
    bumpPlayerMatchStat(target.id, 'shots'); bumpPlayerMatchStat(target.id, 'sot');
    const saveChance = gk ? 0.62+(gk.def-75)/280 : 0.55;
    if(Math.random() < saveChance){
      m.stats[oppSide].saves++;
      if(gk) bumpPlayerMatchStat(gk.id, 'saves');
      addLog(`${label} ${target.name}头球攻门被扑出`, 'chance', 2);
    } else {
      m.score[side]++;
      m.goals.push({side, name:target.name, minute:Math.floor(m.clockSec/60)+1});
      m.ratings[target.id] = (m.ratings[target.id]||6.2)+1.1;
      addLog(`⚽ 角球头球破门！${label} —— ${target.name}`, 'goal', 3);
      m.banner = {text:`⚽ 进球！${target.name}`, cls:'goal'};
      return 3;
    }
  } else {
    addLog('角球被解围', 'buildup', 1);
  }
  return 2;
}

function triggerPenalty(side, oppSide, shooter, defender){
  const m = S.match;
  const label = sideLabel(side);
  m.stats[oppSide].fouls++;
  if(Math.random()<0.28){
    m.stats[oppSide].red++;
    addLog(`🟥 ${defender.name}禁区内犯规染红，送给${label}点球`, 'card-r', 3);
    m.banner = {text:`🟥 红牌！${defender.name}`, cls:'red'};
    const arr = oppSide==='user'?m.xi:m.aiXi;
    const idx = arr.findIndex(pl=>pl.id===defender.id);
    if(idx>=0) arr.splice(idx,1);
  } else {
    m.stats[oppSide].yellow++;
    addLog(`🟨 ${defender.name}禁区内犯规，${label}获得点球`, 'card-y', 3);
  }
  addLog(`🥅 PENALTY —— ${shooter.name}主罚`, 'goal', 3);

  const defXi = oppSide==='user'?m.xi:m.aiXi;
  const gk = defXi.find(p=>p.gk);
  clearTimeout(m.timer);
  m.paused = true;
  m.pendingPenalty = {side, oppSide, shooter, gk};
  render();
  showPenaltyModal();
  return 3;
}

function showPenaltyModal(){
  if(S.opponentType==='friend'){
    promptPenaltyDirection('shooter', (dir1)=>{
      promptPenaltyDirection('keeper', (dir2)=>{
        finishPenalty(S.match.pendingPenalty, dir1, dir2);
      });
    });
  } else {
    const pen = S.match.pendingPenalty;
    const role = pen.side==='user' ? 'shooter' : 'keeper';
    promptPenaltyDirection(role, (dir)=>{
      const aiDir = pick(['left','mid','right']);
      const shooterDir = role==='shooter' ? dir : aiDir;
      const keeperDir = role==='shooter' ? aiDir : dir;
      finishPenalty(S.match.pendingPenalty, shooterDir, keeperDir);
    });
  }
}

function promptPenaltyDirection(role, callback){
  const app = $('#app');
  const div = document.createElement('div');
  div.className='modal-back';
  div.id='penalty-modal';
  const pen = S.match.pendingPenalty;
  const dirLabel = {left:'左路 ⬅️', mid:'中路 ⬆️', right:'右路 ➡️'};
  const roleText = role==='shooter' ? '选择射门方向：' : '你是门将，选择扑救方向：';
  let whoText = '';
  if(S.opponentType==='friend'){
    const shooterIsUser = pen.side==='user';
    const isP1 = role==='shooter' ? shooterIsUser : !shooterIsUser;
    whoText = sideLabel(isP1 ? 'user' : 'ai') + '，';
  }
  // 记录当前弹窗轮到谁决策并广播，访客端据此渲染等价的弹窗
  pen.prompt = {role, decider: deciderForSide(role==='shooter'?pen.side:pen.oppSide, role==='shooter'?pen.oppSide:pen.side)};
  broadcastState();
  div.innerHTML = `
  <div class="modal">
    <h3>🥅 点球大战</h3>
    <div class="sub">${pen.shooter.name} 主罚 vs 门将 ${pen.gk?pen.gk.name:'—'}</div>
    <div class="pmeta" style="margin:12px 0 8px;">${whoText}${roleText}</div>
    <div class="row" style="justify-content:center;gap:10px;">
      ${Object.entries(dirLabel).map(([k,v])=>`<button class="pen-dir" data-dir="${k}" style="flex:1;">${v}</button>`).join('')}
    </div>
  </div>`;
  app.appendChild(div);
  document.querySelectorAll('.pen-dir').forEach(btn=>{
    btn.onclick = ()=>{ div.remove(); callback(btn.dataset.dir); };
  });
}

function finishPenalty(pen, shooterDir, keeperDir){
  const m = S.match;
  const {side, oppSide, shooter, gk} = pen;
  m.stats[side].shots++; m.stats[side].sot++;
  bumpPlayerMatchStat(shooter.id, 'shots'); bumpPlayerMatchStat(shooter.id, 'sot');
  const guessedRight = shooterDir===keeperDir;
  const takerQ = shooter.sho*0.7 + rand(-6,6);
  const gkQ = gk ? gk.def : 65;
  const success = guessedRight
    ? (takerQ - gkQ*1.15 + rand(-10,10)) > 30
    : (takerQ - gkQ*0.30 + rand(-8,8)) > 6;
  if(success){
    m.score[side]++;
    m.goals.push({side, name:shooter.name, minute:Math.floor(m.clockSec/60)+1});
    m.ratings[shooter.id] = (m.ratings[shooter.id]||6.2)+1.0;
    addLog(`⚽ GOAL！${shooter.name}主罚命中`, 'goal', 3);
    m.banner = {text:`⚽ 点球命中！${shooter.name}`, cls:'goal'};
  } else {
    m.stats[oppSide].saves++;
    if(gk) bumpPlayerMatchStat(gk.id, 'saves');
    addLog(`🧤 SAVED！${gk?gk.name:'门将'}${guessedRight?'扑对方向，':''}扑出点球`, 'goal', 3);
    m.banner = {text:`🧤 点球被扑出！${gk?gk.name:'门将'}`, cls:'save'};
  }
  const modal = $('#penalty-modal');
  if(modal && modal.remove) modal.remove();
  m.pendingPenalty = null;
  m.paused = false;
  render();
  resumeClock(1300);
}

function bumpPlayerMatchStat(id, field, amount){
  const m = S.match;
  if(!m.playerMatchStats) m.playerMatchStats = {};
  if(!m.playerMatchStats[id]) m.playerMatchStats[id] = {shots:0, sot:0, saves:0};
  m.playerMatchStats[id][field] += (amount==null?1:amount);
}

function resolveShot(side, oppSide, shooter, defXi, shotType){
  const m = S.match;
  const label = sideLabel(side);
  m.zone = shotType==='long' ? 'edge' : 'box';
  m.carrierName = shooter.name;

  const defenders = defXi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  if(m.zone==='box' && defenders.length && Math.random() < 0.02){
    return triggerPenalty(side, oppSide, shooter, pick(defenders));
  }

  const stats = m.stats[side];
  stats.shots++;
  bumpPlayerMatchStat(shooter.id, 'shots');
  const sf = (m.stamina[shooter.id]!=null?m.stamina[shooter.id]:100)/100;
  let quality;
  if(shotType==='header') quality = shooter.phy*0.5 + shooter.sho*0.35 + rand(-8,8);
  else if(shotType==='long') quality = shooter.sho*0.75 + shooter.dri*0.15 + rand(-12,12);
  else quality = shooter.sho*0.6 + shooter.dri*0.3 + rand(-8,8);
  quality *= (0.8+0.2*sf);

  const onTargetChance = 0.30 + (quality-76)/260;
  const shotWord = shotType==='header'?'头球':(shotType==='long'?'远射':'射门');
  if(Math.random() >= onTargetChance){
    addLog(`${label} ${shooter.name}${shotWord}偏出`, 'chance', 2);
    return Math.max(2, maybeCorner(side, oppSide));
  }
  stats.sot++;
  bumpPlayerMatchStat(shooter.id, 'sot');
  const outfieldDef = defXi.filter(p=>!p.gk);
  const blockDefender = outfieldDef.length ? pick(outfieldDef) : null;
  const blockChance = blockDefender ? Math.max(0, (blockDefender.def-65)/380) : 0;
  if(Math.random() < blockChance){
    addLog(`${label} ${shooter.name}的射门被${blockDefender.name}封堵`, 'chance', 2);
    return Math.max(2, maybeCorner(side, oppSide));
  }
  const gk = defXi.find(p=>p.gk);
  const saveChance = gk ? 0.60 + (gk.def-75)/300 : 0.55;
  if(Math.random() < saveChance){
    m.stats[oppSide].saves++;
    if(gk) bumpPlayerMatchStat(gk.id, 'saves');
    addLog(`🧤 ${label} ${shooter.name}被${gk?gk.name:'门将'}扑出`, 'chance', 2);
    return Math.max(2, maybeCorner(side, oppSide));
  }
  // GOAL
  m.score[side]++;
  m.goals.push({side, name:shooter.name, minute:Math.floor(m.clockSec/60)+1});
  m.ratings[shooter.id] = (m.ratings[shooter.id]||6.2) + 1.1;
  const atkXi = side==='user'?m.xi:m.aiXi;
  const mates = atkXi.filter(p=>p.id!==shooter.id && !p.gk);
  let assistName = null;
  if(mates.length && Math.random()<0.65){
    const a = pick(mates);
    m.assists.push({side, name:a.name, minute:Math.floor(m.clockSec/60)+1});
    m.ratings[a.id] = (m.ratings[a.id]||6.2) + 0.5;
    assistName = a.name;
  }
  addLog(`⚽ 进球！${label} —— ${shooter.name}`, 'goal', 3);
  m.banner = {text: assistName ? `⚽ 进球！${shooter.name}（助攻：${assistName}）` : `⚽ 进球！${shooter.name}`, cls:'goal'};
  return 3;
}

// Shared shooter-selection helper: the tactical core gets a real bump in
// likelihood but never dominates — everyone eligible still gets a fair
// look-in, and a "wider pool" (e.g. a late-arriving midfielder) keeps the
// non-core share from being just one line of players every time.
function pickShooter(core, mainPool, widerPool, coreChance){
  if(core && mainPool.some(p=>p.id===core.id) && Math.random()<coreChance) return core;
  if(widerPool && widerPool.length && Math.random()<0.3) return pick(widerPool);
  if(mainPool.length) return pick(mainPool);
  if(widerPool && widerPool.length) return pick(widerPool);
  return core;
}

function attemptAttack(side, oppSide, atkPower, defPower, atkXi, defXi){
  const m = S.match;
  if(!atkXi.some(p=>!p.gk)) return 1; // 极端短阵容（无非门将球员）时无法发起进攻
  const tactics = side==='user'?m.tactics:m.aiTactics;
  const defTactics = side==='user'?m.aiTactics:m.tactics;
  const label = sideLabel(side);
  const urgency = urgencyMultiplier(side);
  const attackChance = 0.11 * (atkPower.atk/(atkPower.atk+defPower.def*0.9)) * urgency;
  if(Math.random() >= attackChance) return 1;

  // Offside trap: a defending side playing it can specifically snuff out
  // pace-driven attacks (counter / wings) by catching the run early — a
  // distinct high-risk read rather than just a numeric fit bonus.
  if(defTactics.defense==='offside' && ['counter','wings'].includes(tactics.attack) && Math.random()<0.22){
    addLog(`${sideLabel(oppSide)}造越位成功，${label}的反击球员被示意越位在先`, 'buildup', 1);
    return 1;
  }

  if(tactics.attack==='counter' && Math.random()<0.12){
    const foulResult = triggerTacticalFoulChoice(side, oppSide, atkXi, defXi);
    if(foulResult !== null) return foulResult;
  }

  m.zone = 'final';
  const core = tactics.coreId ? atkXi.find(p=>p.id===tactics.coreId) : null;
  const fw = atkXi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  const wide = atkXi.filter(p=>['LM','RM','LW','RW','LB','RB','LWB','RWB'].includes(p.pos));
  const mid = atkXi.filter(p=>['CDM','CM','CAM','LM','RM'].includes(p.pos));
  const others = atkXi.filter(p=>!p.gk);

  let shotType='normal', preLine, shooter, mover;
  if(tactics.attack==='wings'){
    mover = wide.length?pick(wide):pick(others);
    shooter = pickShooter(core, fw.length?fw:[mover], mid, 0.28);
    preLine = `${mover.name}下底传中`;
    shotType='header';
  } else if(tactics.attack==='longball'){
    const target = fw.length ? fw.reduce((a,b)=>a.phy>=b.phy?a:b) : pick(others);
    shooter = pickShooter(core, [target], mid, 0.28);
    preLine = `长传找${target.name}，队友抢第二落点`;
    shotType = Math.random()<0.5 ? 'header' : 'normal';
  } else if(tactics.attack==='counter'){
    shooter = pickShooter(core, fw.length?fw:others, mid, 0.28);
    preLine = `${shooter.name}反越位甩开防守`;
    shotType='normal';
  } else if(tactics.attack==='totalfootball'){
    // Total football: anyone can be the one arriving late into the box —
    // pick the mover/shooter from the whole outfield pool, not just a line.
    mover = pick(others);
    shooter = pickShooter(core, others, null, 0.22);
    preLine = `全员轮转换位，${mover.name}换到肋部插上`;
    shotType = Math.random()<0.3 ? 'header' : 'normal';
  } else if(tactics.attack==='combination'){
    const wideMf = atkXi.filter(p=>['LW','RW','LM','RM'].includes(p.pos));
    mover = wideMf.length?pick(wideMf):pick(others);
    const centralOptions = atkXi.filter(p=>['CAM','CM','ST','CF'].includes(p.pos));
    shooter = pickShooter(core, centralOptions.length?centralOptions:fw, mid, 0.28);
    preLine = `${mover.name}边路内切，边中结合撕开防线`;
    shotType='normal';
  } else if(tactics.attack==='halfspace'){
    const runners = atkXi.filter(p=>['CAM','LW','RW','LM','RM'].includes(p.pos));
    mover = runners.length?pick(runners):pick(others);
    shooter = pickShooter(core, runners.length?runners:fw, fw, 0.28);
    preLine = `${mover.name}杀入肋部空当`;
    shotType='normal';
  } else {
    mover = mid.length?pick(mid):pick(others);
    shooter = pickShooter(core, fw.length?fw:[mover], mid, 0.28);
    preLine = `${mover.name}送出直塞`;
    shotType = Math.random()<0.2 ? 'long' : 'normal';
  }

  const oneOnOneChance = tactics.attack==='counter' ? 0.14 : 0.05;
  if(Math.random() < oneOnOneChance){
    const gk = defXi.find(p=>p.gk);
    const escalated = triggerOneOnOne(side, oppSide, shooter, gk);
    if(escalated !== null) return escalated;
  }

  if(core && shooter.id===core.id) preLine += `，球队在围绕核心 ${core.name} 展开`;
  m.carrierName = (mover||shooter).name;
  addLog(`${label} ${preLine}`, 'chance', 2);

  return resolveShot(side, oppSide, shooter, defXi, shotType);
}

/* ---- Special one-off decision points (capped at 1–2 per match) ----
   Three kinds: a defender's tactical-foul dilemma on a break, a keeper's
   advance-or-hold call in a clean one-on-one, and an attacker's direct-shot
   vs worked-routine choice at a free kick. Whichever side the decision
   belongs to gets asked (if it's the user) or auto-resolves (if it's the AI);
   only choices actually shown to the user count against the shared budget. */

function isHumanSide(side){
  return side==='user' || S.opponentType==='friend';
}
function sideLabel(side){
  if(S.mode==='cup' && S.legendaryCup){
    const cup = S.legendaryCup;
    const fx = cup.fixtures.find(f=>f.id===cup.currentFixture);
    if(fx){
      const team = cup.teams[side==='user'?fx.home:fx.away];
      if(team) return team.label;
    }
  }
  if(S.opponentType==='friend'){
    if(side==='user' && S.customNames.user) return S.customNames.user;
    if(side==='ai' && S.customNames.ai) return S.customNames.ai;
    return side==='user' ? '玩家一' : '玩家二';
  }
  return side==='user' ? '你方' : 'AI';
}

function triggerTacticalFoulChoice(side, oppSide, atkXi, defXi){
  const m = S.match;
  if(isHumanSide(oppSide) && m.userSpecialChoicesUsed >= m.userSpecialChoicesTarget) return null;
  const defenders = defXi.filter(p=>!p.gk);
  if(!defenders.length) return null;
  const defender = pick(defenders);
  const label = sideLabel(side);
  const defLabel = sideLabel(oppSide);
  addLog(`${label}快速反击，${defLabel}只剩${defender.name}回追`, 'chance', 2);
  if(isHumanSide(oppSide)){
    m.userSpecialChoicesUsed++;
    clearTimeout(m.timer);
    m.paused = true;
    m.pendingTacticalFoul = {side, oppSide, defender, atkXi, defXi};
    render();
    showTacticalFoulModal();
    return 3;
  }
  const commitFoul = Math.random() < 0.4;
  return resolveTacticalFoul({side, oppSide, defender, atkXi, defXi}, commitFoul);
}

function resolveTacticalFoul(ctx, commitFoul){
  const m = S.match;
  const {side, oppSide, defender, atkXi, defXi} = ctx;
  const label = sideLabel(side);
  const defLabel = sideLabel(oppSide);
  if(commitFoul){
    m.stats[oppSide].fouls++;
    const roll = Math.random();
    if(roll < 0.08){
      m.stats[oppSide].red++;
      addLog(`🟥 ${defender.name}战术犯规过于严重，直接染红！`, 'card-r', 3);
      m.banner = {text:`🟥 红牌！${defender.name}`, cls:'red'};
      const idx = defXi.findIndex(pl=>pl.id===defender.id);
      if(idx>=0) defXi.splice(idx,1);
      return 3;
    }
    if(roll < 0.62){
      m.stats[oppSide].yellow++;
      addLog(`🟨 ${defender.name}战术犯规，及时破坏了${label}的快攻`, 'card-y', 2);
      m.banner = {text:`🟨 战术犯规！${defender.name}`, cls:'yellow'};
      return 2;
    }
    addLog(`${defLabel} ${defender.name}犯规阻断反击，裁判从宽处理`, 'buildup', 1);
    m.banner = {text:`🛑 战术犯规阻断反击（未出示牌）`, cls:'yellow'};
    return 1;
  }
  addLog(`${defLabel}选择正常防守，不进行战术犯规`, 'buildup', 1);
  const tactics = side==='user'?m.tactics:m.aiTactics;
  const core = tactics.coreId ? atkXi.find(p=>p.id===tactics.coreId) : null;
  const fw = atkXi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  const others = atkXi.filter(p=>!p.gk);
  const shooter = pickShooter(core, fw.length?fw:others, atkXi.filter(p=>['CDM','CM','CAM','LM','RM'].includes(p.pos)), 0.28);
  addLog(`${label} ${shooter.name}反越位甩开防守`, 'chance', 2);
  m.carrierName = shooter.name;
  const before = m.score[side];
  const tier = resolveShot(side, oppSide, shooter, defXi, 'normal');
  if(m.score[side]===before) m.banner = {text:`⚡ 反击未果，${shooter.name}没能把握机会`, cls:'save'};
  return tier;
}

function triggerOneOnOne(side, oppSide, shooter, gk){
  const m = S.match;
  if(isHumanSide(oppSide) && m.userSpecialChoicesUsed >= m.userSpecialChoicesTarget) return null;
  const label = sideLabel(side);
  m.zone = 'box';
  m.carrierName = shooter.name;
  addLog(`${label} ${shooter.name}单刀突破，只剩门将！`, 'chance', 2);
  m.banner = {text:`⚠️ 单刀球！${shooter.name}`, cls:'yellow'};
  if(isHumanSide(oppSide)){
    m.userSpecialChoicesUsed++;
    clearTimeout(m.timer);
    m.paused = true;
    m.pendingOneOnOne = {side, oppSide, shooter, gk};
    render();
    showOneOnOneModal();
    return 3;
  }
  const choice = gk && Math.random() < (gk.def>82?0.35:0.55) ? 'advance' : 'hold';
  return resolveOneOnOne({side, oppSide, shooter, gk}, choice);
}

function resolveOneOnOne(ctx, choice){
  const m = S.match;
  const {side, oppSide, shooter, gk} = ctx;
  m.stats[side].shots++;
  bumpPlayerMatchStat(shooter.id, 'shots');
  let saveChance;
  if(choice==='advance') saveChance = 0.42 + (gk?(gk.def-75)/240:0);
  else saveChance = 0.32 + (gk?(gk.def-75)/300:0) - (shooter.sho-75)/420;
  saveChance = Math.max(0.10, Math.min(0.70, saveChance));
  if(Math.random() < saveChance){
    m.stats[side].sot++;
    m.stats[oppSide].saves++;
    bumpPlayerMatchStat(shooter.id, 'sot');
    if(gk) bumpPlayerMatchStat(gk.id, 'saves');
    const text = choice==='advance' ? `🧤 ${gk?gk.name:'门将'}出击成功没收皮球！` : `🧤 ${gk?gk.name:'门将'}稳稳没收单刀球！`;
    addLog(text, 'goal', 3);
    m.banner = {text, cls:'save'};
  } else {
    m.stats[side].sot++;
    bumpPlayerMatchStat(shooter.id, 'sot');
    m.score[side]++;
    m.goals.push({side, name:shooter.name, minute:Math.floor(m.clockSec/60)+1});
    m.ratings[shooter.id] = (m.ratings[shooter.id]||6.2)+1.1;
    const text = choice==='advance' ? `⚽ ${shooter.name}冷静挑射空门得手！` : `⚽ ${shooter.name}单刀冷静推射破门！`;
    addLog(text, 'goal', 3);
    m.banner = {text:`⚽ 进球！${shooter.name}`, cls:'goal'};
  }
  return 3;
}

function maybeFreeKick(){
  const m = S.match;
  if(Math.random() >= 0.006) return 1;
  const side = Math.random()<0.7 ? m.possession : (m.possession==='user'?'ai':'user');
  const oppSide = side==='user'?'ai':'user';
  if(isHumanSide(side) && m.userSpecialChoicesUsed >= m.userSpecialChoicesTarget) return 1;
  const atkXi = side==='user'?m.xi:m.aiXi;
  const outfield = atkXi.filter(p=>!p.gk);
  if(!outfield.length) return 1;
  const taker = outfield.reduce((a,b)=> a.sho>=b.sho?a:b);
  const label = sideLabel(side);
  addLog(`${label}前场获得任意球，位置极佳`, 'chance', 2);
  if(isHumanSide(side)){
    m.userSpecialChoicesUsed++;
    clearTimeout(m.timer);
    m.paused = true;
    m.pendingFreeKick = {side, oppSide, taker};
    render();
    showFreeKickModal();
    return null;
  }
  const choice = Math.random()<0.5 ? 'direct' : 'setplay';
  return resolveFreeKick({side, oppSide, taker}, choice);
}

function resolveFreeKick(fk, choice){
  const m = S.match;
  const {side, oppSide, taker} = fk;
  const label = sideLabel(side);
  const defXi = oppSide==='user'?m.xi:m.aiXi;
  const atkXi = side==='user'?m.xi:m.aiXi;
  m.zone = 'edge';
  m.carrierName = taker.name;
  if(choice==='direct'){
    addLog(`${label} ${taker.name}选择直接主罚`, 'chance', 2);
    const before = m.score[side];
    const tier = resolveShot(side, oppSide, taker, defXi, 'long');
    if(m.score[side]===before) m.banner = {text:`🎯 任意球直接主罚，${taker.name}未能建功`, cls:'save'};
    return tier;
  }
  if(Math.random() >= 0.7){
    addLog(`${label}战术任意球被对方提前解围`, 'chance', 2);
    m.banner = {text:'🔀 战术任意球被解围', cls:'save'};
    return 2;
  }
  const others = atkXi.filter(p=>!p.gk && p.id!==taker.id);
  const shooter = others.length?pick(others):taker;
  addLog(`${label}任意球配合，${shooter.name}获得射门机会`, 'chance', 2);
  m.carrierName = shooter.name;
  const before2 = m.score[side];
  const tier2 = resolveShot(side, oppSide, shooter, defXi, 'normal');
  if(m.score[side]===before2) m.banner = {text:`🔀 战术任意球配合，${shooter.name}未能建功`, cls:'save'};
  return tier2;
}

function maybeFoul(side){
  const m = S.match;
  const xi = side==='user'?m.xi:m.aiXi;
  const fielders = xi.filter(p=>!p.gk);
  if(!fielders.length || Math.random() >= 0.03) return 1;
  const label = sideLabel(side);
  const p = pick(fielders);
  const fatigue = 1 - ((m.stamina[p.id]!=null?m.stamina[p.id]:100)/100);
  m.stats[side].fouls++;
  const aggRoll = Math.random() * (p.phy/100) + fatigue*0.15;
  if(aggRoll > 0.82){
    if(Math.random()<0.18){
      m.stats[side].red++;
      addLog(`🟥 红牌！${label} ${p.name}被罚下`, 'card-r', 3);
      m.banner = {text:`🟥 红牌！${p.name}`, cls:'red'};
      const idx = xi.findIndex(pl=>pl.id===p.id);
      if(idx>=0) xi.splice(idx,1);
      return 3;
    }
    m.stats[side].yellow++;
    addLog(`🟨 黄牌，${label} ${p.name}`, 'card-y', 2);
    m.banner = {text:`🟨 黄牌！${p.name}`, cls:'yellow'};
    return 2;
  }
  addLog(`${label} ${p.name}犯规`, 'buildup', 1);
  return 1;
}

function maybeInjury(side){
  const m = S.match;
  const xi = side==='user'?m.xi:m.aiXi;
  const fielders = xi.filter(p=>!p.gk);
  if(!fielders.length) return 1;
  const avgFatigue = 1 - (avg(fielders.map(p=>(m.stamina[p.id]!=null?m.stamina[p.id]:100)))/100);
  if(Math.random() >= 0.0009 + avgFatigue*0.004) return 1;
  const label = sideLabel(side);
  const p = pick(fielders);
  const severe = Math.random() < 0.2;
  if(!severe){
    addLog(`${label} ${p.name}轻微磕碰，简单处理后继续比赛`, 'chance', 2);
    m.stamina[p.id] = Math.max(30, (m.stamina[p.id]||100) - 15);
    return 2;
  }
  const bench = side==='user'?m.userBench:m.aiBench;
  const idx = xi.findIndex(pl=>pl.id===p.id);
  const replIdx = bench.findIndex(b=> b.pos===p.pos || (COMPAT[p.pos]||[]).includes(b.pos) || (b.alt&&b.alt.includes(p.pos)));
  if(idx>=0 && replIdx>=0){
    const repl = bench.splice(replIdx,1)[0];
    xi[idx] = repl;
    m.stamina[repl.id] = 100;
    m.subsUsed[side]++;
    addLog(`🚑 ${label} ${p.name}伤退，${repl.name}替补登场`, 'card-r', 3);
    m.banner = {text:`🚑 ${p.name}伤退，${repl.name}替补登场`, cls:'red'};
  } else if(idx>=0){
    xi.splice(idx,1);
    addLog(`🚑 ${label} ${p.name}重伤离场，且已无合适替补，球队只能少一人应战`, 'card-r', 3);
    m.banner = {text:`🚑 ${p.name}重伤离场！`, cls:'red'};
  }
  return 3;
}

function power(xi, tactics, formation, isAI, staminaMap){
  const analysis = computeAnalysis(xi, xi, formation, tactics, !!isAI, staminaMap);
  const fitAtk = attackFitFor(tactics.attack, xi, staminaMap)/100;
  const fitDef = defenseFitFor(tactics.defense, xi, staminaMap)/100;
  const stF = p => staminaMap ? (0.7+0.3*((staminaMap[p.id]!=null?staminaMap[p.id]:100)/100)) : 1;
  const fw = xi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  const mf = xi.filter(p=>['CM','CDM','CAM','LM','RM'].includes(p.pos));
  const df = xi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  const gk = xi.find(p=>p.gk);
  const chem = 1 + Math.min(0.15, analysis.bonuses.length*0.02) - Math.min(0.20, (analysis.penalties?analysis.penalties.reduce((s,p)=>s+p.penalty,0):0));
  const coreBoost = analysis.coreFitTag==='gold' ? 1.08 : (analysis.coreFitTag==='warn' ? 0.94 : 1.0);
  const atk = (avg(fw.map(p=>p.sho))*0.4 + avg(mf.map(p=>p.pas))*0.35 + avg(fw.map(p=>p.dri*stF(p)))*0.25) * fitAtk * chem * coreBoost;
  const def = (avg(df.map(p=>p.def*stF(p)))*0.55 + (gk?gk.def+30:60)*0.25 + avg(mf.map(p=>p.def*stF(p)))*0.2) * fitDef * chem;
  return {atk: atk||55, def: def||55, gk};
}

function runClock(){
  const m = S.match;
  if(!m || m.finished || m.paused) return;
  const delay = simulateTick();
  if(delay===null) return;
  m.timer = setTimeout(runClock, delay);
}

// Used whenever we resume/kick off from outside the normal tick loop (kickoff,
// halftime resume, after a penalty) so any banner just set (⚽/🟢/⏱) actually
// gets a moment on screen before the next tick clears it — calling runClock()
// directly there would run the next tick synchronously and wipe it instantly.
function resumeClock(delay){
  const m = S.match;
  if(!m || m.finished || m.paused) return;
  m.timer = setTimeout(runClock, delay || 1100);
}

function simulateTick(){
  const m = S.match;
  m.banner = null;
  const dur = Math.floor(rand(12,26));
  m.clockSec += dur;

  if(!m.halftimeDone && m.clockSec>=2700){
    m.clockSec = 2700;
    pauseForAdjust('halftime');
    return null;
  }
  if(m.clockSec>=5400){
    m.clockSec = 5400;
    finishMatch();
    return null;
  }

  decayStamina(dur);

  ['user','ai'].forEach(side=>{
    const oppSide = side==='user'?'ai':'user';
    const diff = m.score[side]-m.score[oppSide];
    const minute = Math.floor(m.clockSec/60)+1;
    if(minute>60 && diff<0 && !m.pushFlagged[side]){
      m.pushFlagged[side]=true;
      addLog(`${sideLabel(side)}落后，开始压上强攻`, 'buildup', 1);
    }
  });

  const pu = power(m.xi, m.tactics, S.formation, false, m.stamina);
  const pa = power(m.aiXi, m.aiTactics, S.aiFormation, true, m.stamina);
  const totalPow = pu.atk + pa.atk;
  m.stats.user.possTicks += dur * (pu.atk/totalPow);
  m.stats.ai.possTicks += dur * (pa.atk/totalPow);
  const liveTotal = m.stats.user.possTicks + m.stats.ai.possTicks;
  if(liveTotal>0){
    m.stats.user.poss = Math.round(100*m.stats.user.possTicks/liveTotal);
    m.stats.ai.poss = 100 - m.stats.user.poss;
  }

  const side = Math.random() < (pu.atk/totalPow) ? 'user' : 'ai';
  const oppSide = side==='user' ? 'ai' : 'user';
  m.possession = side;
  m.zone = 'mid';
  m.ballY = 50 + rand(-16,16);
  const line = buildupLine(side);
  if(Math.random()<0.6) addLog(line, 'buildup', 1);

  const atkPower = side==='user'?pu:pa;
  const defPower = side==='user'?pa:pu;
  const atkXi = side==='user'?m.xi:m.aiXi;
  const defXi = side==='user'?m.aiXi:m.xi;
  let maxTier = attemptAttack(side, oppSide, atkPower, defPower, atkXi, defXi);
  if(m.paused) return null; // a penalty / one-on-one / tactical foul choice is awaiting input

  maxTier = Math.max(maxTier, maybeFoul('user'));
  maxTier = Math.max(maxTier, maybeFoul('ai'));
  maxTier = Math.max(maxTier, maybeInjury('user'));
  maxTier = Math.max(maxTier, maybeInjury('ai'));

  const fkTier = maybeFreeKick();
  if(m.paused) return null; // a free-kick choice is awaiting input
  maxTier = Math.max(maxTier, fkTier||1);

  updateMatchDOM();
  if(maxTier>=3) return rand(1200,1800);
  if(maxTier===2) return rand(420,680);
  return rand(90,170);
}

function pauseForAdjust(kind){
  const m = S.match;
  clearTimeout(m.timer);
  m.paused = true;
  if(kind==='halftime'){ m.halftimeDone = true; m.banner = {text:'⏱ 中场休息', cls:'save'}; }
  render();
  showAdjustModal(kind);
}

function finishMatch(){
  const m = S.match;
  const liveTotal = m.stats.user.possTicks + m.stats.ai.possTicks;
  if(liveTotal>0){
    m.stats.user.poss = Math.round(100*m.stats.user.possTicks/liveTotal);
    m.stats.ai.poss = 100 - m.stats.user.poss;
  }
  m.finished = true;
  m.banner = {text:'🏁 比赛结束', cls:'save'};
  render();
}

function updateMatchDOM(){
  // cheap full re-render is fine at this scale/pace
  render();
}

function lineY(count, i){
  if(count<=1) return 50;
  const spread = Math.min(76, 20*count);
  const start = 50-spread/2;
  return start + (spread*(i/(count-1)));
}
function teamDots(xi, side, coreId, push, yDrift, carrierName){
  const gk = xi.filter(p=>p.gk);
  const def = xi.filter(p=>['CB','LB','RB','LWB','RWB'].includes(p.pos));
  const mid = xi.filter(p=>['CDM','CM','CAM','LM','RM'].includes(p.pos));
  const fwd = xi.filter(p=>['ST','CF','LW','RW'].includes(p.pos));
  const dirSign = side==='user' ? 1 : -1;
  const shift = (push||0)*dirSign;
  const lines = side==='user'
    ? [{arr:gk,x:6},{arr:def,x:20+shift},{arr:mid,x:34+shift},{arr:fwd,x:47+shift}]
    : [{arr:gk,x:94},{arr:def,x:80+shift},{arr:mid,x:66+shift},{arr:fwd,x:53+shift}];
  const dots=[];
  lines.forEach(line=>{
    line.arr.forEach((p,i)=> dots.push({
      x:line.x, y:Math.max(6,Math.min(94, lineY(line.arr.length,i)+(yDrift||0))),
      name:p.name, core:p.id===coreId, isCarrier: !!carrierName && p.name===carrierName,
    }));
  });
  return dots;
}
function pitchHTML(){
  const m = S.match;
  const ZONE_X = {own:20, mid:50, final:68, edge:80, box:88};
  let ballX = ZONE_X[m.zone]!=null ? ZONE_X[m.zone] : 50;
  if(m.possession==='ai') ballX = 100-ballX;
  const ballY = m.ballY!=null ? m.ballY : 50;
  // Team shape drifts a little toward the ball's vertical position too, not
  // just pushed up/down the pitch by possession — makes the shape feel like
  // it's actually reacting to where play is happening.
  const yDrift = (ballY-50)*0.08;
  const userPush = m.possession==='user' ? 6 : -3;
  const aiPush = m.possession==='ai' ? 6 : -3;
  const userDots = teamDots(m.xi, 'user', m.tactics.coreId, userPush, yDrift, m.carrierName);
  const aiDots = teamDots(m.aiXi, 'ai', m.aiTactics.coreId, aiPush, yDrift, m.carrierName);
  let delayCounter = 0;
  const dotHTML = (d, cls) => {
    delayCounter++;
    const delay = ((delayCounter*0.23) % 2.6).toFixed(2);
    const carrierCls = d.isCarrier ? ' carrier' : '';
    return `<div class="pdot ${cls}${d.core?' core':''}${carrierCls}" style="left:${d.x}%;top:${d.y}%;animation-delay:${delay}s;"><span>${d.name}</span></div>`;
  };
  return `
  <div class="pitch">
    <div class="pitch-outer"></div>
    <div class="pitch-center-dot"></div>
    <div class="pbox left"></div><div class="pbox right"></div>
    <div class="pbox-inner left"></div><div class="pbox-inner right"></div>
    <div class="pspot left"></div><div class="pspot right"></div>
    ${userDots.map(d=>dotHTML(d,'')).join('')}
    ${aiDots.map(d=>dotHTML(d,'ai')).join('')}
    <div class="ball-shadow" style="left:${ballX}%;top:${Math.min(96,ballY+3)}%;"></div>
    <div class="ball" style="left:${ballX}%;top:${ballY}%;"></div>
    ${m.carrierName?`<div class="ball-label" style="left:${ballX}%;top:${ballY}%;">${m.carrierName}</div>`:''}
  </div>`;
}

      <select id="adj-attack" style="width:100%;margin-top:4px;">
        ${Object.entries(ATTACK_TACTICS).map(([k,v])=>`<option value="${k}" ${teamTactics.attack===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div style="margin:12px 0;">
      <label class="pmeta">防守策略</label>
      <select id="adj-defense" style="width:100%;margin-top:4px;">
        ${Object.entries(DEFENSE_TACTICS).map(([k,v])=>`<option value="${k}" ${teamTactics.defense===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div style="margin:12px 0;">
      <label class="pmeta">战术核心</label>
      <select id="adj-core" style="width:100%;margin-top:4px;">
        <option value="">— 无 —</option>
        ${xi.filter(p=>!p.gk).map(p=>`<option value="${p.id}" ${teamTactics.coreId===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select>
    </div>
    <div style="margin:12px 0;">
      <label class="pmeta">换人（可多项，${bench.length}人可换）</label>
      ${xi.map((p,idx)=>`
        <div class="pitch-slot">
          <div class="slot-pos">${p.pos}</div>
          <div style="flex:1;font-size:13px;">${p.name}<span class="pmeta"> 体能 ${Math.round(S.match.stamina[p.id]!=null?S.match.stamina[p.id]:100)}</span></div>
          <select data-outidx="${idx}" class="sub-select">
            <option value="">— 不换 —</option>
            ${bench.map(b=>`<option value="${b.id}">${b.name}（${b.pos}, ${b.ovr}）</option>`).join('')}
          </select>
        </div>`).join('') || '<div class="sub">替补席已空</div>'}
    </div>
    <button class="primary" id="btn-apply-adjust" style="width:100%;">确认，${kind==='halftime'?'继续下半场':'恢复比赛'}</button>
  </div>`;
  app.appendChild(div);
  $('#btn-apply-adjust').onclick = ()=>{
    teamTactics.attack = $('#adj-attack').value;
    teamTactics.defense = $('#adj-defense').value;
    teamTactics.coreId = $('#adj-core').value || null;

    const usedBenchIds = new Set();
    document.querySelectorAll('.sub-select').forEach(sel=>{
      const val = sel.value;
      if(!val || usedBenchIds.has(val)) return;
      const outIdx = Number(sel.dataset.outidx);
      const benchIdx = bench.findIndex(b=>b.id===val);
      const outgoing = xi[outIdx];
      if(benchIdx<0 || !outgoing) return;
      const incoming = bench.splice(benchIdx,1)[0];
      xi[outIdx] = incoming;
      S.match.stamina[incoming.id] = 100;
      usedBenchIds.add(val);
      if(teamTactics.coreId === outgoing.id) teamTactics.coreId = null;
      addLog(`🔄 换人：${incoming.name} 换下 ${outgoing.name}`, 'card-y', 2);
    });

    if(kind==='timeout' && !isAi) S.match.timeoutsLeft--;
    div.remove();
    S.match.pendingAdjust = null;

    if(kind==='halftime' && S.opponentType==='friend' && !isAi){
      // player 1 done — hand the same halftime adjustment to player 2 before resuming
      showAdjustModal('halftime', 'ai');
      return;
    }
    if(kind==='halftime') S.match.banner = {text:'🟢 下半场开始', cls:'goal'};
    S.match.paused = false;
    render();
    resumeClock(S.match.banner ? 1100 : 300);
  };
}

/* ---------- 10. POST-MATCH ANALYSIS ---------- */
function matchNarrative(){
  const m = S.match;
  const lines = [];
  const uAnalysis = computeAnalysis(S.userSquad, m.xi, S.formation, m.tactics, false, m.stamina);
  const aAnalysis = computeAnalysis(S.aiSquad, m.aiXi, S.aiFormation, m.aiTactics, true, m.stamina);
  const possU = m.stats.user.poss, possA = m.stats.ai.poss;
  if(Math.abs(possU-possA)>=8){
    const userLed = possU>possA;
    const leaderLabel = userLed?'你方':'AI';
    const tacticLabel = userLed?ATTACK_TACTICS[m.tactics.attack].label:ATTACK_TACTICS[m.aiTactics.attack].label;
    lines.push(`${leaderLabel}的「${tacticLabel}」打法掌控了比赛节奏，控球率达到 ${Math.max(possU,possA)}%。`);
  }
  const uBonusNames = uAnalysis.bonuses.filter(b=>b.tag!=='structure').map(b=>b.label);
  if(uBonusNames.length) lines.push(`你的阵容激活了 ${uBonusNames.slice(0,2).join('、')}，配合更加流畅。`);
  const aBonusNames = aAnalysis.bonuses.filter(b=>b.tag!=='structure').map(b=>b.label);
  if(aBonusNames.length) lines.push(`AI 一方的 ${aBonusNames.slice(0,2).join('、')} 也在发挥作用。`);
  ['user','ai'].forEach(side=>{
    const tactics = side==='user'?m.tactics:m.aiTactics;
    const xi = side==='user'?m.xi:m.aiXi;
    if(tactics.defense==='high'){
      const outfield = xi.filter(p=>!p.gk);
      const avgSt = outfield.length ? avg(outfield.map(p=>m.stamina[p.id]!=null?m.stamina[p.id]:100)) : 100;
      if(avgSt<65) lines.push(`${sideLabel(side)}的高位压迫在体能下降后（末段平均体能约 ${Math.round(avgSt)}）效果明显减弱，三线距离被拉开，身后空间随之暴露。`);
    }
  });
  // ---- 结合真实战术术语，针对本场使用到的具体打法给出更专业的点评 ----
  ['user','ai'].forEach(side=>{
    const tactics = side==='user'?m.tactics:m.aiTactics;
    const goals = m.goals.filter(g=>g.side===side).length;
    if(tactics.attack==='counter' && goals>0){
      lines.push(`${sideLabel(side)}的「防守反击」打出了${goals}次高效的由守转攻，抓住对方推进后留出的身后空间完成致命一击。`);
    }
    if(tactics.attack==='wings'){
      const wingGoals = m.goals.filter(g=>g.side===side).length;
      if(wingGoals>0) lines.push(`${sideLabel(side)}持续冲击边路走廊，传中找到禁区内包抄形成威胁。`);
    }
    if(tactics.attack==='totalfootball'){
      lines.push(`${sideLabel(side)}的「全攻全守」让球员在肋部空间不断换位，防守方很难用人盯人的方式锁死进攻发起点。`);
    }
    if(tactics.defense==='offside'){
      lines.push(`${sideLabel(side)}用「造越位」把防线整体压高，三线距离压缩，对方多次反越位的球员被卡在越位线上。`);
    }
  });
  if(m.stats.user.corners!==m.stats.ai.corners){
    const more = m.stats.user.corners>m.stats.ai.corners?'user':'ai';
    lines.push(`${sideLabel(more)}定位球机会更多（${Math.max(m.stats.user.corners,m.stats.ai.corners)}个角球），禁区内的二次进攻威胁也随之增加。`);
  }
  const coreU = m.tactics.coreId ? byId(m.tactics.coreId) : null;
  if(coreU){
    const g = m.goals.filter(x=>x.side==='user' && x.name===coreU.name).length;
    const a = m.assists.filter(x=>x.side==='user' && x.name===coreU.name).length;
    if(g||a) lines.push(`战术核心 ${coreU.name} 贡献了 ${g} 球 ${a} 助攻，是你方进攻的关键。`);
  }
  const coreA = m.aiTactics.coreId ? byId(m.aiTactics.coreId) : null;
  if(coreA){
    const g = m.goals.filter(x=>x.side==='ai' && x.name===coreA.name).length;
    const a = m.assists.filter(x=>x.side==='ai' && x.name===coreA.name).length;
    if(g||a) lines.push(`AI 的核心 ${coreA.name} 制造了 ${g} 球 ${a} 助攻的威胁。`);
  }
  if(!lines.length) lines.push('双方战术执行都比较平稳，比赛走势基本符合实力对比。');

  // ---- 胜负归因：综合阵容质量、羁绊数量、战术契合度、控球几个维度给结论 ----
  const scoreDiff = m.score.user - m.score.ai;
  if(scoreDiff!==0){
    const winner = scoreDiff>0 ? 'user' : 'ai';
    const winLabel = sideLabel(winner);
    const wAnalysis = winner==='user'?uAnalysis:aAnalysis;
    const lAnalysis = winner==='user'?aAnalysis:uAnalysis;
    const reasons = [];
    if(wAnalysis.squadQuality > lAnalysis.squadQuality+2) reasons.push('阵容整体实力更强');
    const wBonusCount = wAnalysis.bonuses.filter(b=>b.tag!=='structure').length;
    const lBonusCount = lAnalysis.bonuses.filter(b=>b.tag!=='structure').length;
    if(wBonusCount > lBonusCount) reasons.push('羁绊加成更多，配合更默契');
    if(wAnalysis.coreFitTag==='gold' && lAnalysis.coreFitTag!=='gold') reasons.push('战术核心与打法完美契合');
    const wPoss = winner==='user'?possU:possA;
    const lPoss = winner==='user'?possA:possU;
    if(wPoss - lPoss >= 8) reasons.push('控球率占优，掌控了比赛节奏');
    if(!reasons.length) reasons.push('临场发挥更胜一筹');
    lines.push(`🏆 结论：${winLabel}${Math.abs(scoreDiff)>=2?'大比分':''}获胜，关键在于${reasons.slice(0,3).join('、')}。`);
  } else {
    lines.push(`⚖️ 结论：双方实力接近（阵容评分 ${uAnalysis.squadQuality} : ${aAnalysis.squadQuality}），战成平局在情理之中。`);
  }
  return lines;
}

function synthesizePasses(p){
  const baseTouches = ({GK:22,CB:58,LB:62,RB:62,LWB:66,RWB:66,CDM:72,CM:66,CAM:56,LM:56,RM:56,LW:40,RW:40,ST:30,CF:36})[p.pos] || 46;
  const attempted = Math.round(baseTouches * (0.85+Math.random()*0.3));
  const accuracy = Math.min(96, Math.max(55, p.pas*0.9 + rand(-5,5)));
  const completed = Math.round(attempted*accuracy/100);
  return {attempted, completed};
}
function rosterTableHTML(xi, side, title){
  const m = S.match;
  const rows = xi.map(p=>{
    const rating = m.ratings[p.id]!=null ? m.ratings[p.id] : 6.2;
    const g = m.goals.filter(x=>x.side===side && x.name===p.name).length;
    const a = m.assists.filter(x=>x.side===side && x.name===p.name).length;
    const shotStat = (m.playerMatchStats && m.playerMatchStats[p.id]) || {shots:0,sot:0,saves:0};
    const passes = synthesizePasses(p);
    return {name:p.name, pos:p.pos, rating, g, a, shots:shotStat.shots, sot:shotStat.sot, saves:shotStat.saves, passes, isGk:!!p.gk};
  });
  rows.sort((x,y)=> y.rating-x.rating);
  return `
  <div class="col">
    <div class="sub" style="margin-bottom:6px;">${title}</div>
    <table class="stats roster">
      ${rows.map(r=>{
        const statLine = r.isGk
          ? `扑救 ${r.saves} 次`
          : `射门 ${r.sot}/${r.shots}（射正/总）　传球 ${r.passes.completed}/${r.passes.attempted}`;
        return `<tr>
        <td class="rpos">${r.pos}</td>
        <td class="rname">${r.name}</td>
        <td class="rrate" style="color:${r.rating>=7.5?'var(--teal)':(r.rating<6?'var(--red)':'var(--text)')}">${r.rating.toFixed(1)}</td>
        <td class="rmark">${r.g?'⚽'.repeat(Math.min(r.g,3)):''}${r.a?' 🅰'.repeat(Math.min(r.a,3)):''}</td>
      </tr>
      <tr><td></td><td colspan="3" class="pmeta" style="padding:0 0 6px;font-size:11px;">${statLine}</td></tr>`;
      }).join('')}
    </table>
  </div>`;
}

function cupReportSection(){
  const cup = S.legendaryCup;
  const fx = cup.fixtures.find(f=>f.id===cup.currentFixture);
  const home = cup.teams[fx.home], away = cup.teams[fx.away];
  const STAGE_LABEL = {group:'小组赛', semi:'半决赛', final:'决赛'};
  let resultLine;
  if(fx.stage==='group'){
    resultLine = `${STAGE_LABEL[fx.stage]}（${fx.groupId}组）：${home.label} ${fx.homeScore} - ${fx.awayScore} ${away.label}`;
  } else {
    const winnerTeam = cup.teams[fx.winner];
    resultLine = `${STAGE_LABEL[fx.stage]}：${home.label} ${fx.homeScore} - ${fx.awayScore} ${away.label}${fx.decidedBy==='shootout'?'（点球大战决出胜负）':''} · ${winnerTeam.label} 晋级`;
  }
  return `
  <div class="sub" style="margin-top:16px;font-size:15px;color:var(--text);">${resultLine}</div>
  <div style="margin-top:16px;display:flex;gap:10px;">
    <button class="primary" id="btn-cup-continue">继续杯赛 →</button>
  </div>`;
}

function reportScreen(){
  const m = S.match;
  const allXi = [...m.xi, ...m.aiXi];
  let motm = allXi.filter(p=>!p.gk)[0] || allXi[0];
  let best=-1;
  allXi.forEach(p=>{ const r=m.ratings[p.id]||6.2; if(r>best){best=r; motm=p;} });
  const motmSide = m.xi.some(p=>p.id===motm.id) ? 'user' : 'ai';
  const motmGoals = m.goals.filter(x=>x.side===motmSide && x.name===motm.name).length;
  const motmAssists = m.assists.filter(x=>x.side===motmSide && x.name===motm.name).length;
  const motmShotStat = (m.playerMatchStats && m.playerMatchStats[motm.id]) || {shots:0,sot:0,saves:0};
  const motmPasses = synthesizePasses(motm);
  let motmBlurb;
  if(motm.gk && motmShotStat.saves>0) motmBlurb = `${motmShotStat.saves} 次关键扑救稳住了球门`;
  else if(motmGoals>=2) motmBlurb = `梅开二度，比赛的绝对主角`;
  else if(motmGoals>=1 && motmAssists>=1) motmBlurb = `一射一传，攻防两端都有贡献`;
  else if(motmGoals>=1) motmBlurb = `打入关键进球`;
  else if(motmAssists>=1) motmBlurb = `送出致命一传`;
  else motmBlurb = `全场表现最稳定，多次串联进攻`;
  const result = m.score.user>m.score.ai ? '🏆 你赢得了比赛！' : (m.score.user<m.score.ai ? '比赛告负，重新调整阵容再来一次。' : '双方战成平局。');
  return `
  <div class="panel">
    <h2>赛后报告</h2>
    ${m.instantSimulated ? `<div class="pmeta" style="margin-bottom:6px;">🎲 本场为直接模拟结果，没有完整的比赛过程记录。</div>` : ''}
    <div class="sub" style="font-size:15px;color:var(--text);">${result}</div>
    <div class="scoreboard" style="padding-top:0;">
      <div class="team">${sideLabel('user')}</div>
      <div class="score">${m.score.user} : ${m.score.ai}</div>
      <div class="team">${sideLabel('ai')}</div>
    </div>
    <table class="stats">
      <tr><td class="lhs">${m.stats.user.shots}</td><td class="mid">射门</td><td class="rhs">${m.stats.ai.shots}</td></tr>
      <tr><td class="lhs">${m.stats.user.sot}</td><td class="mid">射正</td><td class="rhs">${m.stats.ai.sot}</td></tr>
      <tr><td class="lhs">${m.stats.user.poss}%</td><td class="mid">控球率</td><td class="rhs">${m.stats.ai.poss}%</td></tr>
      <tr><td class="lhs">${m.stats.user.corners}</td><td class="mid">角球</td><td class="rhs">${m.stats.ai.corners}</td></tr>
      <tr><td class="lhs">${m.stats.user.fouls}</td><td class="mid">犯规</td><td class="rhs">${m.stats.ai.fouls}</td></tr>
      <tr><td class="lhs">${m.stats.user.yellow}🟨 ${m.stats.user.red}🟥</td><td class="mid">纪律</td><td class="rhs">${m.stats.ai.yellow}🟨 ${m.stats.ai.red}🟥</td></tr>
      <tr><td class="lhs">${m.stats.user.saves}</td><td class="mid">扑救</td><td class="rhs">${m.stats.ai.saves}</td></tr>
    </table>
    <div class="panel" style="margin-top:16px;background:var(--panel-alt);">
      <div class="row" style="align-items:center;gap:10px;">
        <span class="chip gold" style="font-size:13px;">MOTM ⭐ ${motm.name}</span>
        <span class="pmeta" style="margin:0;">${sideLabel(motmSide)} · ${motm.pos} · 评分 ${(m.ratings[motm.id]||6.2).toFixed(1)}</span>
      </div>
      <div class="pmeta" style="margin-top:8px;">${motmBlurb}${motm.gk?`（扑救 ${motmShotStat.saves} 次）`:`（${motmGoals} 球 ${motmAssists} 助攻，射门 ${motmShotStat.sot}/${motmShotStat.shots}，传球 ${motmPasses.completed}/${motmPasses.attempted}）`}</div>
    </div>
    <div style="margin-top:12px;">
      ${m.goals.map(g=>`<span class="chip">⚽ ${g.minute}' ${g.name}</span>`).join('')}
    </div>
    <div class="row" style="margin-top:18px;gap:16px;">
      ${rosterTableHTML(m.xi, 'user', sideLabel('user') + ' · 球员评分')}
      ${rosterTableHTML(m.aiXi, 'ai', sideLabel('ai') + ' · 球员评分')}
    </div>
    <div class="panel" style="margin-top:16px;background:var(--panel-alt);">
      <h3 style="font-family:var(--font-head);font-weight:500;margin:0 0 8px;">赛后分析</h3>
      ${matchNarrative().map(l=>`<div class="pmeta" style="margin-bottom:6px;line-height:1.6;">${l}</div>`).join('')}
    </div>
    ${S.mode==='cup' && S.legendaryCup ? cupReportSection() : `
    <div style="margin-top:22px;display:flex;gap:10px;">
      <button id="btn-again">重新开始一局</button>
      <button class="primary" id="btn-menu">返回模式选择</button>
    </div>`}
  </div>`;
}

/* ---------- 12. Event wiring ---------- */
function wireEvents(){
  const b = id => $('#'+id);
  document.querySelectorAll('.mode-btn').forEach(el=>{
    el.onclick = ()=>{
      const mode = el.dataset.mode;
      if(mode==='cup'){ S.screen = 'cup-type-select'; }
      else { S.pendingMode = mode; S.screen = 'opponent-select'; }
      render();
    };
  });
  document.querySelectorAll('.opp-btn').forEach(el=>{
    el.onclick = ()=>{
      const opp = el.dataset.opp;
      if(opp==='friend'){
        S.roomContext = {kind:'friend', mode:S.pendingMode};
        S.roomCode = '';
        S.roomAction = 'host';
        S.roomJoinInput = '';
        S.net = freshNet();
        S.screen = 'room-code';
      } else if(S.pendingMode==='budget'){
        startBudgetMode('ai');
      } else {
        startDraftMode(S.pendingMode, 'ai');
      }
      render();
    };
  });
  document.querySelectorAll('.human-count-btn').forEach(el=>{
    el.onclick = ()=>{ S.pendingHumanCount = Number(el.dataset.n); render(); };
  });
  if(b('btn-start-cup')) b('btn-start-cup').onclick = ()=>{
    const n = S.pendingHumanCount||1;
    const type = S.pendingCupType||'club';
    S.pendingAiTeams = [];
    if(n>1){
      S.roomContext = {kind:'cup', humanCount:n, cupType:type};
      S.roomCode = '';
      S.roomAction = 'host';
      S.roomJoinInput = '';
      S.net = freshNet();
      S.screen = 'room-code';
    } else {
      S.pendingCupPlayerNames = [];
      S.screen = 'cup-ai-select';
    }
    render();
  };
  document.querySelectorAll('.cup-type-btn').forEach(el=>{
    el.onclick = ()=>{ S.pendingCupType = el.dataset.type; S.pendingHumanCount = S.pendingHumanCount || 1; S.screen = 'cup-setup'; render(); };
  });
  if(b('btn-back-cup-setup')) b('btn-back-cup-setup').onclick = ()=>{ S.screen = 'cup-setup'; render(); };
  document.querySelectorAll('.ai-team-row').forEach(el=>{
    el.onclick = ()=>{
      const label = el.dataset.label;
      const needed = 8 - (S.pendingHumanCount||1);
      const idx = S.pendingAiTeams.indexOf(label);
      if(idx>=0) S.pendingAiTeams.splice(idx,1);
      else if(S.pendingAiTeams.length<needed) S.pendingAiTeams.push(label);
      render();
    };
  });
  if(b('btn-confirm-ai-teams')) b('btn-confirm-ai-teams').onclick = ()=>{
    const needed = 8 - (S.pendingHumanCount||1);
    if(S.pendingAiTeams.length!==needed) return;
    startLegendaryCup(S.pendingHumanCount||1, S.pendingCupType||'club', S.pendingAiTeams, S.pendingCupPlayerNames);
    render();
  };
  if(b('btn-room-host')) b('btn-room-host').onclick = ()=>{ S.roomAction='host'; render(); };
  if(b('btn-room-join')) b('btn-room-join').onclick = ()=>{ S.roomAction='join'; render(); };
  if(b('room-join-input')) b('room-join-input').oninput = (e)=>{ S.roomJoinInput = e.target.value; };
  if(b('my-name-input')) b('my-name-input').oninput = (e)=>{ S.net.myName = e.target.value; };
  if(b('btn-do-create-room')) b('btn-do-create-room').onclick = ()=>{
    S.customNames.user = (S.net.myName||'').trim();
    const ctx = S.roomContext;
    const capacity = ctx && ctx.kind==='cup' ? (ctx.humanCount||1) : 2;
    netCreateRoom(capacity);
  };
  if(b('btn-do-join-room')) b('btn-do-join-room').onclick = ()=>{
    netJoinRoom(S.roomJoinInput, S.net.myName);
  };
  if(b('btn-room-back')) b('btn-room-back').onclick = ()=>{
    const ctx = S.roomContext;
    if(S.net.ws){ try{ S.net.ws.close(); }catch(e){} }
    S.net = freshNet();
    S.roomCode = '';
    S.screen = (ctx && ctx.kind==='cup') ? 'cup-setup' : 'opponent-select';
    render();
  };
  if(b('btn-room-continue')) b('btn-room-continue').onclick = ()=>{
    // 仅房主可用：访客界面上该按钮始终 disabled/不存在，访客只等房主的第一次状态广播。
    const ctx = S.roomContext;
    if(!ctx || S.net.role!=='host') return;
    if(ctx.kind==='friend'){
      S.customNames.user = (S.net.myName||'').trim();
      if(ctx.mode==='budget') startBudgetMode('friend');
      else startDraftMode(ctx.mode, 'friend');
    } else if(ctx.kind==='cup'){
      const humanCount = ctx.humanCount||1;
      const names = [S.customNames.user];
      for(let i=1;i<humanCount;i++) names.push(S.net.peerNames[i]||'');
      S.pendingCupPlayerNames = names;
      S.pendingAiTeams=[]; S.screen = 'cup-ai-select';
    }
    render();
  };
  if(b('btn-cup-kickoff-prep')) b('btn-cup-kickoff-prep').onclick = ()=>{
    const cup = S.legendaryCup;
    const fx = cup.fixtures.find(f=>f.id===cup.currentFixture);
    const home = cup.teams[fx.home], away = cup.teams[fx.away];
    cup.pendingConfirm = [];
    if(home.type==='human') cup.pendingConfirm.push('home');
    if(away.type==='human') cup.pendingConfirm.push('away');
    if(cup.pendingConfirm.length===0){
      loadFixtureIntoMatchSlots(fx);
      startMatch();
      return;
    }
    pointCupConfirmUIAt(fx, cup.pendingConfirm[0]);
    S.screen = 'tactics';
    render();
  };
  if(b('btn-back-menu')) b('btn-back-menu').onclick = ()=>{ S.screen='menu'; render(); };
  if(b('btn-refresh-pool')) b('btn-refresh-pool').onclick = ()=>{
    if(S.poolRefreshUsed) return;
    const ownedIdentities = new Set(S.userSquad.map(p=>p.identity));
    let fresh = generatePool(SEPARATE_POOL_SIZE, SEPARATE_GK_COUNT).filter(p=>!ownedIdentities.has(p.identity));
    S.pool = fresh;
    S.poolRefreshUsed = true;
    render();
  };
  if(b('btn-restore-save')) b('btn-restore-save').onclick = ()=>{ restoreSave(); };
  if(b('btn-budget-end-early')) b('btn-budget-end-early').onclick = ()=>{ endBudgetDraftEarly(); };
  if(b('btn-auto-complete-squad')) b('btn-auto-complete-squad').onclick = ()=>{ autoCompleteSquad(); render(); };

  document.querySelectorAll('#pool-list .prow').forEach(el=>{
    el.onclick = ()=> poolPick(el.dataset.id);
  });
  document.querySelectorAll('.tab-btn[data-tab]').forEach(el=>{
    el.onclick = ()=>{ S.draftTab = el.dataset.tab; S.searchQuery=''; render(); };
  });
  if(b('player-search')){
    const el = b('player-search');
    el.oninput = (e)=>{
      S.searchQuery = e.target.value;
      render();
      const refocus = ()=>{ const inp=b('player-search'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } };
      if(typeof requestAnimationFrame==='function') requestAnimationFrame(refocus); else setTimeout(refocus, 0);
    };
  }

  if(b('sel-formation')) b('sel-formation').onchange = e=>{
    S.formation = e.target.value;
    S.lineup = autoAssign(S.userSquad, S.formation);
    render();
  };
  document.querySelectorAll('.slot-select').forEach(el=>{
    el.onchange = e=>{
      const slot = e.target.dataset.slot;
      if(e.target.value) S.lineup[slot] = e.target.value; else delete S.lineup[slot];
      render();
    };
  });
  if(b('btn-to-tactics-from-draft')) b('btn-to-tactics-from-draft').onclick = ()=>{ dedupeAiSquadAgainstUser(); S.screen='tactics'; render(); };

  document.querySelectorAll('input[name=attack]').forEach(el=> el.onchange = e=>{ S.tactics.attack = e.target.value; render(); });
  document.querySelectorAll('input[name=defense]').forEach(el=> el.onchange = e=>{ S.tactics.defense = e.target.value; render(); });
  if(b('sel-core-player')) b('sel-core-player').onchange = e=>{ S.tactics.coreId = e.target.value || null; render(); };

  if(b('btn-back-draft')) b('btn-back-draft').onclick = ()=>{ S.screen='draft'; render(); };
  if(b('btn-kickoff')) b('btn-kickoff').onclick = ()=>{
    if(S.mode==='cup'){
      cupConfirmTactics();
      render();
    } else if(S.opponentType==='friend'){
      if(!S.handoff){ beginHandoffToPlayer2(); render(); }
      else { finishHandoffAndKickoff(); }
    } else {
      startMatch();
    }
  };
  if(b('btn-instant-sim')) b('btn-instant-sim').onclick = ()=>{
    simulateMatchInstantly();
    if(S.mode==='cup' && S.legendaryCup){
      const cup = S.legendaryCup;
      const fx = cup.fixtures.find(f=>f.id===cup.currentFixture);
      if(fx && !fx.played) recordFixtureResult(fx, extractResultFromMatch());
    }
    render();
  };
  if(b('btn-handoff-continue')) b('btn-handoff-continue').onclick = ()=>{ S.screen='draft'; render(); };
  if(b('btn-vs-continue')) b('btn-vs-continue').onclick = ()=>{ beginMatchAfterPoster(); };

  if(b('btn-timeout')) b('btn-timeout').onclick = ()=>{
    if(S.match.timeoutsLeft<=0 || S.match.finished) return;
    pauseForAdjust('timeout');
  };
  if(b('btn-report')) b('btn-report').onclick = ()=>{
    if(S.mode==='cup' && S.legendaryCup){
      const cup = S.legendaryCup;
      const fx = cup.fixtures.find(f=>f.id===cup.currentFixture);
      if(fx && !fx.played) recordFixtureResult(fx, extractResultFromMatch());
    }
    S.screen='report'; render();
  };

  if(b('btn-again')) b('btn-again').onclick = ()=>{
    clearSave();
    if(S.net.ws){ try{ S.net.ws.close(); }catch(e){} }
    S.net = freshNet();
    S.roomCode = '';
    S.screen='menu'; S={...S, screen:'menu'};
    render();
  };
  if(b('btn-menu')) b('btn-menu').onclick = ()=>{ clearSave(); location.reload(); };
  if(b('btn-cup-continue')) b('btn-cup-continue').onclick = ()=>{
    advanceCupFixtures();
    render();
  };
}

render();
</script>
</body>
</html>
